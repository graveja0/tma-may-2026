<div id="password-gate" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #1C1C1C; z-index: 999999; display: flex; align-items: center; justify-content: center;">
  <div style="text-align: center; max-width: 540px; padding: 40px;">
    <div style="color: #CFAE70; font-family: 'Times New Roman', serif; font-size: 2.0em; font-weight: bold; line-height: 1.2; margin-bottom: 20px;">
      Paying for Tomorrow's Health Care
    </div>
    <div style="color: #E0D5C0; font-size: 0.95em; margin-bottom: 30px; font-family: Arial, sans-serif;">
      Draft for review. Enter the password to view.
    </div>
    <form id="password-form" style="margin: 0;">
      <input
        type="password"
        id="password-input"
        placeholder="Password"
        autofocus
        autocomplete="off"
        style="font-size: 1.1em; padding: 12px 16px; border: 1px solid #CFAE70; background: #1C1C1C; color: #E0D5C0; width: 100%; max-width: 320px; box-sizing: border-box; outline: none; font-family: Arial, sans-serif; text-align: center; margin-bottom: 16px; display: block; margin-left: auto; margin-right: auto; border-radius: 2px;"
      />
      <button
        type="submit"
        id="password-submit"
        style="font-size: 1.0em; padding: 10px 28px; background: #CFAE70; color: #1C1C1C; border: none; cursor: pointer; font-weight: 600; font-family: Arial, sans-serif; border-radius: 2px;"
      >Unlock</button>
    </form>
    <div id="password-error" style="color: #E08080; margin-top: 18px; min-height: 20px; font-size: 0.9em; font-family: Arial, sans-serif;"></div>
  </div>
</div>

<script>
(function () {
  // Simple deterrent gate. Not real security — anyone with DevTools can bypass.
  // Suitable for a polite "draft, please don't share" gate to a trusted reviewer.
  var PASSWORD = "TMA2026";
  var gate = document.getElementById("password-gate");
  var input = document.getElementById("password-input");
  var form = document.getElementById("password-form");
  var errorDiv = document.getElementById("password-error");

  // Skip the gate if already unlocked this session.
  try {
    if (sessionStorage.getItem("deck-unlocked") === "true") {
      gate.style.display = "none";
      return;
    }
  } catch (e) { /* sessionStorage may be unavailable */ }

  // While the gate is up, swallow Reveal.js keyboard navigation
  // (arrows, page-up/down, etc.) so the deck doesn't advance behind the curtain.
  function blockKeys(e) {
    if (gate.style.display === "none") return;
    if (e.target === input) return; // let typing in the password field through
    e.stopPropagation();
    e.preventDefault();
  }
  document.addEventListener("keydown", blockKeys, true);

  function tryUnlock(e) {
    if (e) e.preventDefault();
    if (input.value === PASSWORD) {
      try { sessionStorage.setItem("deck-unlocked", "true"); } catch (e) {}
      gate.style.transition = "opacity 0.4s";
      gate.style.opacity = "0";
      setTimeout(function () {
        gate.style.display = "none";
        document.removeEventListener("keydown", blockKeys, true);
        if (window.Reveal && typeof window.Reveal.slide === "function") {
          // After unlock, return focus to slide 0.
          try { window.Reveal.slide(0, 0); } catch (e) {}
        }
      }, 400);
    } else {
      errorDiv.textContent = "Incorrect password.";
      input.value = "";
      input.focus();
    }
  }

  form.addEventListener("submit", tryUnlock);
  input.focus();
})();
</script>
